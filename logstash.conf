
input {
  file {
    # Aceita múltiplos arquivos usando wildcard (*)
    path => ["/caminho/para/logs/*.log"]
    
    # Mantém o estado do arquivo entre reinícios
    sincedb_path => "/var/lib/logstash/sincedb"
    
    # Evita ler linhas antigas ao iniciar
    start_position => "beginning"
    
    # Tipo para identificar nos filtros e no Elasticsearch
    type => "log"
  }
}

filter { 
  grok {
    match => { "message" => "%{IP:ip} %{WORD:metodo} %{NUMBER:status}" }
    
    # Ignora mensagens que não batem com o padrão
    tag_on_failure => ["_grokparsefailure"]
  }
  
  # Adiciona timestamp caso não exista
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    # Se não conseguir, usa o horário atual
    add_field => { "timestamp_failed" => "%{@timestamp}" }
  }
}

output {
  elasticsearch {
    hosts => ["localhost:9200"]
    index => "logs-%{+YYYY.MM.dd}"  # Cria índice diário
    document_type => "_doc"
    # Pode autenticar se o Elasticsearch exigir user/pass
    # user => "usuario"
    # password => "senha"
  }

  # Mantém uma saída para console para debug
  stdout {
    codec => rubydebug
  }
}
